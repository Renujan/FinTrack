components:
  schemas:
    AccountOverview:
      type: object
      properties:
        user_info:
          type: object
          additionalProperties: {}
        profile:
          type: object
          additionalProperties: {}
        preferences:
          type: object
          additionalProperties: {}
        subscription:
          type: object
          additionalProperties: {}
        statistics:
          type: object
          additionalProperties: {}
        recent_activity:
          type: array
          items: {}
      required:
      - preferences
      - profile
      - recent_activity
      - statistics
      - subscription
      - user_info
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - IMPORT
      - EXPORT
      - LOGIN
      - LOGOUT
      - PASSWORD_CHANGE
      - BACKUP_CREATED
      - BACKUP_DOWNLOADED
      - BACKUP_DELETED
      - RESTORE_VALIDATED
      type: string
      description: |-
        * `CREATE` - Create
        * `UPDATE` - Update
        * `DELETE` - Delete
        * `IMPORT` - Import
        * `EXPORT` - Export
        * `LOGIN` - Login
        * `LOGOUT` - Logout
        * `PASSWORD_CHANGE` - Password Change
        * `BACKUP_CREATED` - Backup Created
        * `BACKUP_DOWNLOADED` - Backup Downloaded
        * `BACKUP_DELETED` - Backup Deleted
        * `RESTORE_VALIDATED` - Restore Validated
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        resource_type:
          type: string
          readOnly: true
        resource_id:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        metadata:
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - id
      - ip_address
      - metadata
      - resource_id
      - resource_type
      - timestamp
      - user
    BackupTypeEnum:
      enum:
      - FULL
      - TRANSACTIONS
      - SELECTED_DATA
      type: string
      description: |-
        * `FULL` - Full Backup
        * `TRANSACTIONS` - Transactions & Categories
        * `SELECTED_DATA` - Selected Data
    BalanceSummary:
      type: object
      properties:
        total_income:
          type: string
        total_expenses:
          type: string
        current_balance:
          type: string
        transaction_count:
          type: integer
        income_transaction_count:
          type: integer
        expense_transaction_count:
          type: integer
        balance_type:
          type: string
        note:
          type: string
      required:
      - balance_type
      - current_balance
      - expense_transaction_count
      - income_transaction_count
      - note
      - total_expenses
      - total_income
      - transaction_count
    BillingPeriodEnum:
      enum:
      - MONTHLY
      - YEARLY
      type: string
      description: |-
        * `MONTHLY` - Monthly
        * `YEARLY` - Yearly
    Budget:
      type: object
      description: |-
        Serializer for Budget model with calculation status metrics, category ownership validation,
        date-range validation, and budget period validation.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        category:
          type: integer
          nullable: true
        category_name:
          type: string
          readOnly: true
        is_overall:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        budget_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        period:
          $ref: '#/components/schemas/PeriodEnum'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        spent_amount:
          type: string
          readOnly: true
        remaining_amount:
          type: string
          readOnly: true
        percentage_used:
          type: string
          readOnly: true
        is_exceeded:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - budget_amount
      - category_name
      - created_at
      - end_date
      - id
      - is_exceeded
      - is_overall
      - name
      - percentage_used
      - remaining_amount
      - spent_amount
      - start_date
      - updated_at
    BudgetOverview:
      type: object
      properties:
        total_budgets:
          type: integer
        active_budgets:
          type: integer
        exceeded_budgets:
          type: integer
        budgets_near_limit:
          type: integer
        total_budget_amount:
          type: string
        total_spent_amount:
          type: string
        remaining_amount:
          type: string
        overall_utilization_percentage:
          type: number
          format: double
        budgets_summary:
          type: array
          items:
            $ref: '#/components/schemas/BudgetSummaryItem'
      required:
      - active_budgets
      - budgets_near_limit
      - budgets_summary
      - exceeded_budgets
      - overall_utilization_percentage
      - remaining_amount
      - total_budget_amount
      - total_budgets
      - total_spent_amount
    BudgetRequest:
      type: object
      description: |-
        Serializer for Budget model with calculation status metrics, category ownership validation,
        date-range validation, and budget period validation.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          type: integer
          nullable: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        period:
          $ref: '#/components/schemas/PeriodEnum'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
      required:
      - amount
      - end_date
      - name
      - start_date
    BudgetSummaryItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category_name:
          type: string
          nullable: true
        is_overall:
          type: boolean
        budget_amount:
          type: string
        spent_amount:
          type: string
        remaining_amount:
          type: string
        percentage_used:
          type: number
          format: double
        is_exceeded:
          type: boolean
        is_near_limit:
          type: boolean
      required:
      - budget_amount
      - category_name
      - id
      - is_exceeded
      - is_near_limit
      - is_overall
      - name
      - percentage_used
      - remaining_amount
      - spent_amount
    CashFlowSummaryItem:
      type: object
      properties:
        period:
          type: string
        income:
          type: string
        expenses:
          type: string
        net_cash_flow:
          type: string
        transaction_count:
          type: integer
      required:
      - expenses
      - income
      - net_cash_flow
      - period
      - transaction_count
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    CategoryMin:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - name
    DashboardAlertItem:
      type: object
      properties:
        type:
          type: string
        message:
          type: string
        severity:
          type: string
        category:
          type: string
        metadata:
          type: object
          additionalProperties: {}
      required:
      - category
      - message
      - severity
      - type
    DashboardFinancialSummary:
      type: object
      properties:
        total_income:
          type: string
        total_expenses:
          type: string
        current_balance:
          type: string
        net_cash_flow:
          type: string
      required:
      - current_balance
      - net_cash_flow
      - total_expenses
      - total_income
    DataBackup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        status:
          allOf:
          - $ref: '#/components/schemas/DataBackupStatusEnum'
          readOnly: true
        backup_type:
          $ref: '#/components/schemas/BackupTypeEnum'
        file_size:
          type: integer
          readOnly: true
          description: Backup file size in bytes
        record_count:
          type: integer
          readOnly: true
          description: Total number of records included in backup
        metadata:
          readOnly: true
          description: Detailed section record counts and metadata
        created_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_expired:
          type: boolean
          readOnly: true
        download_url:
          type: string
          readOnly: true
      required:
      - completed_at
      - created_at
      - download_url
      - expires_at
      - file_size
      - id
      - is_expired
      - metadata
      - name
      - record_count
      - status
    DataBackupCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: Optional custom name for the backup record
          maxLength: 255
        backup_type:
          allOf:
          - $ref: '#/components/schemas/BackupTypeEnum'
          default: FULL
          description: |-
            Backup type: FULL, TRANSACTIONS, or SELECTED_DATA

            * `FULL` - Full Backup
            * `TRANSACTIONS` - Transactions & Categories
            * `SELECTED_DATA` - Selected Data
        include_sections:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          description: Specific sections to include for SELECTED_DATA (e.g. ['transactions',
            'budgets', 'goals', 'categories', 'recurring'])
        retention_days:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
          description: Number of days before backup expires (1-365 days, default 30)
    DataBackupStatusEnum:
      enum:
      - PENDING
      - PROCESSING
      - COMPLETED
      - FAILED
      - EXPIRED
      type: string
      description: |-
        * `PENDING` - Pending
        * `PROCESSING` - Processing
        * `COMPLETED` - Completed
        * `FAILED` - Failed
        * `EXPIRED` - Expired
    DateFormatEnum:
      enum:
      - YYYY-MM-DD
      - DD/MM/YYYY
      - MM/DD/YYYY
      type: string
      description: |-
        * `YYYY-MM-DD` - YYYY-MM-DD (e.g. 2026-08-27)
        * `DD/MM/YYYY` - DD/MM/YYYY (e.g. 27/08/2026)
        * `MM/DD/YYYY` - MM/DD/YYYY (e.g. 08/27/2026)
    DefaultTransactionTypeEnum:
      enum:
      - EXPENSE
      - INCOME
      type: string
      description: |-
        * `EXPENSE` - Expense
        * `INCOME` - Income
