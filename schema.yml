openapi: 3.0.3
info:
  title: SaaS Finance Tracker API
  version: 1.0.0
  description: Comprehensive RESTful API for personal & multi-tenant business financial
    tracking, budgets, analytics, recurring items, reports, and subscription tier
    management.
paths:
  /api/account/change-password/:
    post:
      operationId: account_change_password_create
      description: Securely changes account password requiring current password validation
        and matching password confirmation.
      summary: Change Authenticated User Password
      tags:
      - User Profile & Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeSuccessResponse'
          description: ''
        '400':
          description: Current password incorrect or validation error
        '401':
          description: Authentication required
  /api/account/overview/:
    get:
      operationId: account_overview_retrieve
      description: Returns comprehensive overview of current account user info, active
        profile, preferences, subscription tier, entity counters, and recent activity.
      summary: Retrieve Account Overview & Activity Summary
      tags:
      - User Profile & Account
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOverview'
          description: ''
        '401':
          description: Authentication required
  /api/account/preferences/:
    get:
      operationId: account_preferences_retrieve
      description: Retrieves or updates authenticated user settings including preferred
        currency, date format, timezone, and notification toggles.
      summary: Retrieve or Update User Account Preferences
      tags:
      - User Profile & Account
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreference'
          description: ''
        '400':
          description: Invalid preference configuration values
        '401':
          description: Authentication required
    put:
      operationId: account_preferences_update
      description: Retrieves or updates authenticated user settings including preferred
        currency, date format, timezone, and notification toggles.
      summary: Retrieve or Update User Account Preferences
      tags:
      - User Profile & Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferenceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserPreferenceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserPreferenceRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreference'
          description: ''
        '400':
          description: Invalid preference configuration values
        '401':
          description: Authentication required
    patch:
      operationId: account_preferences_partial_update
      description: Retrieves or updates authenticated user settings including preferred
        currency, date format, timezone, and notification toggles.
      summary: Retrieve or Update User Account Preferences
      tags:
      - User Profile & Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserPreferenceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserPreferenceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserPreferenceRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreference'
          description: ''
        '400':
          description: Invalid preference configuration values
        '401':
          description: Authentication required
  /api/account/profile/:
    get:
      operationId: account_profile_retrieve
      description: Retrieves or updates authenticated user profile details including
        name, bio, phone number, and currency.
      summary: Retrieve or Update Authenticated User Profile
      tags:
      - User Profile & Account
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          description: Validation error or duplicate email/username
        '401':
          description: Authentication credentials required
    put:
      operationId: account_profile_update
      description: Retrieves or updates authenticated user profile details including
        name, bio, phone number, and currency.
      summary: Retrieve or Update Authenticated User Profile
      tags:
      - User Profile & Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          description: Validation error or duplicate email/username
        '401':
          description: Authentication credentials required
    patch:
      operationId: account_profile_partial_update
      description: Retrieves or updates authenticated user profile details including
        name, bio, phone number, and currency.
      summary: Retrieve or Update Authenticated User Profile
      tags:
      - User Profile & Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          description: Validation error or duplicate email/username
        '401':
          description: Authentication credentials required
  /api/analytics/budgets/:
    get:
      operationId: analytics_budgets_retrieve
      description: Returns budget utilization rates, warning indicators, and remaining
        limits.
      summary: Budget Progress & Utilization Analytics
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date filter (YYYY-MM-DD)
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date filter (YYYY-MM-DD)
      tags:
      - Analytics
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: Budget analytics report
        '400':
          description: Invalid parameters
        '401':
          description: Authentication required
  /api/analytics/categories/:
    get:
      operationId: analytics_categories_retrieve
      description: Returns percentage breakdown and total spending by category for
        expense transactions.
      summary: Category Spending Analytics
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date filter (YYYY-MM-DD)
      - in: query
        name: limit
        schema:
          type: integer
        description: Limit top N categories
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date filter (YYYY-MM-DD)
      tags:
      - Analytics
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: Category analytics breakdown
        '400':
          description: Invalid parameters
        '401':
          description: Authentication required
  /api/analytics/comparison/:
    get:
      operationId: analytics_comparison_retrieve
      description: Compares income, expense, and net savings between the selected
        period and the preceding equal period.
      summary: Period Comparison Analysis
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date filter (YYYY-MM-DD)
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date filter (YYYY-MM-DD)
      tags:
      - Analytics
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: Period comparison metrics
        '400':
          description: Invalid parameters
        '401':
          description: Authentication required
  /api/analytics/monthly/:
    get:
      operationId: analytics_monthly_retrieve
      description: Returns monthly aggregated financial performance metrics for historical
        analysis.
      summary: Monthly Chronological Summary
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date filter (YYYY-MM-DD)
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date filter (YYYY-MM-DD)
      tags:
      - Analytics
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: Monthly summary dataset
        '400':
          description: Invalid date parameters
        '401':
          description: Authentication required
  /api/analytics/summary/:
    get:
      operationId: analytics_summary_retrieve
      description: Returns income, expense, net savings, and category distribution
        overview for the specified date range.
      summary: Dashboard Overview Summary
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date filter (YYYY-MM-DD)
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date filter (YYYY-MM-DD)
      tags:
      - Analytics
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: Dashboard summary metrics
        '400':
          description: Invalid date format or range
        '401':
          description: Authentication required
  /api/analytics/trends/:
    get:
      operationId: analytics_trends_retrieve
      description: Returns time-series income, expense, and net balance trends grouped
        by daily, weekly, or monthly periods.
      summary: Financial Trends Aggregation
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date filter (YYYY-MM-DD)
      - in: query
        name: group_by
        schema:
          type: string
          enum:
          - daily
          - monthly
          - weekly
        description: Grouping granularity
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date filter (YYYY-MM-DD)
      tags:
      - Analytics
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: Financial trends array
        '400':
          description: Invalid parameters
        '401':
          description: Authentication required
  /api/audit-logs/:
    get:
      operationId: audit_logs_list
      description: Retrieves security and activity audit logs for actions performed
        by the user.
      summary: List Audit Logs
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Audit Logs
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
        '400':
          description: Invalid filter parameters
        '401':
          description: Authentication required
  /api/audit-logs/{id}/:
    get:
      operationId: audit_logs_retrieve
      description: Retrieves a specific audit log entry by ID.
      summary: Retrieve Audit Log Entry
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Audit Logs
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
        '401':
          description: Authentication required
        '404':
          description: Audit log entry not found
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates user credentials and returns JWT access and refresh
        tokens. Logs login audit events upon success.
      summary: Obtain JWT Access & Refresh Tokens (Login)
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainResponse'
          description: ''
        '401':
          description: Invalid credentials
        '429':
          description: Rate limit exceeded
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the provided JWT refresh token to revoke future access.
      summary: Blacklist Refresh Token (Logout)
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccessResponse'
          description: ''
        '400':
          description: Missing or invalid refresh token
        '401':
          description: Authentication credentials were not provided
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      description: Retrieves or updates authenticated user details including email,
        name, and currency configuration.
      summary: Retrieve or Update Current User Profile
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          description: Invalid profile update data
        '401':
          description: Authentication required
    put:
      operationId: auth_profile_update
      description: Retrieves or updates authenticated user details including email,
        name, and currency configuration.
      summary: Retrieve or Update Current User Profile
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          description: Invalid profile update data
        '401':
          description: Authentication required
    patch:
      operationId: auth_profile_partial_update
      description: Retrieves or updates authenticated user details including email,
        name, and currency configuration.
      summary: Retrieve or Update Current User Profile
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          description: Invalid profile update data
        '401':
          description: Authentication required
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Registers a new user account with default subscription tier, email,
        password, and currency preference.
      summary: Register a New User
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccessResponse'
          description: ''
        '400':
          description: Validation error or existing username/email
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/backups/:
    get:
      operationId: backups_list
      description: Retrieve history and metadata of user financial backups.
      summary: List user backups
      parameters:
      - in: query
        name: backup_type
        schema:
          type: string
        description: Filter by backup type (FULL, TRANSACTIONS, SELECTED_DATA)
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
        description: Filter by status (PENDING, PROCESSING, COMPLETED, FAILED, EXPIRED)
      tags:
      - backups
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDataBackupList'
          description: ''
    post:
      operationId: backups_create
      description: Generate a new JSON data backup for user financial records.
      summary: Create financial backup
      tags:
      - backups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataBackupCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DataBackupCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DataBackupCreateRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataBackup'
          description: ''
  /api/backups/{id}/:
    get:
      operationId: backups_retrieve
      description: Retrieve metadata and download information for a specific backup
        record.
      summary: Get backup details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - backups
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataBackup'
          description: ''
    delete:
      operationId: backups_destroy
      description: Safely delete a user backup record and remove its associated file
        from storage.
      summary: Delete backup record
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - backups
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/backups/{id}/download/:
    get:
      operationId: backups_download_retrieve
      description: Securely stream and download the JSON financial data backup file.
      summary: Download backup file
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - backups
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
  /api/backups/cleanup-expired/:
    post:
      operationId: backups_cleanup_expired_create
      description: Process retention rules and mark expired user backups as EXPIRED
        while removing associated files.
      summary: Cleanup expired backups
      tags:
      - backups
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/backups/validate-restore/:
    post:
      operationId: backups_validate_restore_create
      description: Validate a financial backup file or payload for restore preparation
        without altering any database records.
      summary: Validate restore data
      tags:
      - backups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreValidationRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RestoreValidationRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RestoreValidationRequestRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/budgets/:
    get:
      operationId: budgets_list
      description: Retrieves a list of spending budgets with progress metrics or creates
        a new budget.
      summary: List or Create Category Budgets
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Budgets
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBudgetList'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBudgetList'
          description: ''
        '400':
          description: Validation error or invalid query params
        '402':
          description: Budget creation limit reached for active subscription plan
        '401':
          description: Authentication required
    post:
      operationId: budgets_create
      description: Retrieves a list of spending budgets with progress metrics or creates
        a new budget.
      summary: List or Create Category Budgets
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
